version: '3.8'

services:
  backend:
    build:
      context: ..
/
      dockerfile: opsys/Dockerfile.backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-opsys-change-me}
      - TEACHER_PASSWORD=${TEACHER_PASSWORD:-admin123}
      - DB_PATH=/data/opsys.db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - backend-data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:4000/api/health']
      interval: 30s
      retries: 3

  frontend:
    build:
      context: ../../
      dockerfile: opsys/Dockerfile.frontend
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:4000}
      - NEXT_PUBLIC_MODE=local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data: