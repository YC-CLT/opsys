name: OPSys CI

on:
  push:
    branches: [main, dev/*]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: opsys/pnpm-lock.yaml
      - run: pnpm install
        working-directory: opsys
      - run: pnpm --filter frontend lint
        working-directory: opsys
        continue-on-error: true
      - run: pnpm --filter frontend build
        working-directory: opsys

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: opsys/pnpm-lock.yaml
      - run: pnpm install
        working-directory: opsys
      - run: pnpm --filter backend build
        working-directory: opsys
      - run: pnpm --filter backend typecheck
        working-directory: opsys
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, backend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f opsys/Dockerfile.backend -t opsys-backend opsys/
      - name: Build frontend image
        run: docker build -f opsys/Dockerfile.frontend -t opsys-frontend opsys/