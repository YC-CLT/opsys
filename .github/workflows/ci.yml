name: OPSys CI

on:
  push:
    branches: [main]
    paths:
      - 'opsys/**'
  pull_request:
    branches: [main]
    paths:
      - 'opsys/**'

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: opsys/pnpm-lock.yaml
      - run: pnpm install
        working-directory: opsys
      - run: pnpm --filter frontend lint
        working-directory: opsys
        continue-on-error: true
      - run: pnpm --filter frontend build
        working-directory: opsys

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: opsys/pnpm-lock.yaml
      - run: pnpm install
        working-directory: opsys
      - run: pnpm --filter backend build
        working-directory: opsys
      - run: pnpm --filter backend typecheck
        working-directory: opsys
        continue-on-error: true

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [lint-typecheck, backend-check]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: opsys/
          file: opsys/Dockerfile.backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/yc-clt/opsys-backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OPSys backend service
      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: opsys/
          file: opsys/Dockerfile.frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/yc-clt/opsys-frontend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=OPSys frontend Next.js app