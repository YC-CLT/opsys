name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'opsys/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: opsys/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: opsys
        run: pnpm install --frozen-lockfile

      - name: Generate answer hashes & Build static
        working-directory: opsys
        env:
          NEXT_PUBLIC_MODE: static
          BUILD_STATIC: '1'
        run: pnpm --filter frontend run build:static

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: opsys/frontend/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4